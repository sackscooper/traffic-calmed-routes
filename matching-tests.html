<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Traffic-Calming Matching Tests</title>
</head>
<body>
  <h1>Traffic-Calming Matching Tests</h1>
  <pre id="results">Running...</pre>

  <script src="https://cdn.jsdelivr.net/npm/@turf/turf@6/turf.min.js"></script>
  <script type="module">
    import {
      clearRouteState,
      createRouteAppState,
      swapRouteState
    } from "./js/app-state.js";
    import { MIN_CONTIGUOUS_MATCH_METERS } from "./js/config.js";
    import {
      findTrafficCalmingMatches,
      getUniqueMatchedProjects
    } from "./js/traffic-matching.js";
    import {
      calculateTrafficCalmingExposure,
      recalculateAnalyzedRouteScores
    } from "./js/route-scoring.js";
    import {
      createRouteWaypoint,
      getPlaceLabel,
      normalizeBrowserRoute,
      resolvePlacePrediction
    } from "./js/google-api.js";

    const testResults = [];

    function assert(condition, message) {
      if (!condition) throw new Error(message);
    }

    function test(name, callback) {
      try {
        callback();
        testResults.push({ name, passed: true });
      } catch (error) {
        testResults.push({
          name,
          passed: false,
          message: error.message
        });
      }
    }

    async function asyncTest(name, callback) {
      try {
        await callback();
        testResults.push({ name, passed: true });
      } catch (error) {
        testResults.push({
          name,
          passed: false,
          message: error.message
        });
      }
    }

    function createTestSegment(coordinates, objectId) {
      const turfLine = turf.lineString(coordinates);

      return {
        props: { OBJECTID: objectId },
        coordinates,
        turfLine,
        bbox: turf.bbox(turfLine),
        lengthMeters:
          turf.length(turfLine, { units: "kilometers" }) * 1000,
        googleLine: { setOptions() {} }
      };
    }

    const testRoute = [
      [-86.8, 36.1],
      [-86.79, 36.1]
    ];
    const alignedSegment = createTestSegment([
      [-86.798, 36.1],
      [-86.793, 36.1]
    ], 1);
    const perpendicularSegment = createTestSegment([
      [-86.795, 36.098],
      [-86.795, 36.102]
    ], 2);
    const shortAlignedSegment = createTestSegment([
      [-86.797, 36.1],
      [-86.7968, 36.1]
    ], 3);
    const parallelOutsideThreshold = createTestSegment([
      [-86.798, 36.1003],
      [-86.793, 36.1003]
    ], 4);
    const distantSegments = Array.from({ length: 300 }, (_, index) =>
      createTestSegment([
        [-87.5, 35 + index * 0.00001],
        [-87.49, 35 + index * 0.00001]
      ], 1000 + index)
    );

    test("matches a nearby aligned road", () => {
      const analysis = findTrafficCalmingMatches(
        testRoute,
        [alignedSegment]
      );
      assert(analysis.matches.length === 1, "Expected one aligned match.");
      assert(
        analysis.matches[0].overlapDistanceMeters >=
          MIN_CONTIGUOUS_MATCH_METERS,
        "Expected a meaningful contiguous overlap."
      );
    });

    test("rejects a perpendicular crossing", () => {
      const analysis = findTrafficCalmingMatches(
        testRoute,
        [perpendicularSegment]
      );
      assert(analysis.matches.length === 0, "Perpendicular road was matched.");
    });

    test("rejects an aligned overlap shorter than the minimum", () => {
      const analysis = findTrafficCalmingMatches(
        testRoute,
        [shortAlignedSegment]
      );
      assert(analysis.matches.length === 0, "Short overlap was matched.");
    });

    test("rejects a parallel road outside the distance threshold", () => {
      const analysis = findTrafficCalmingMatches(
        testRoute,
        [parallelOutsideThreshold]
      );
      assert(analysis.matches.length === 0, "Distant parallel road was matched.");
    });

    test("prefilters distant segments before detailed matching", () => {
      const segments = [
        alignedSegment,
        perpendicularSegment,
        ...distantSegments
      ];
      const analysis = findTrafficCalmingMatches(testRoute, segments);
      assert(
        analysis.candidateSegmentCount < segments.length / 10,
        "Bounding-box prefilter retained too many distant segments."
      );
    });

    test("combines multiple geometry parts from one project", () => {
      const projects = getUniqueMatchedProjects([
        { ...alignedSegment, overlapDistanceMeters: 100 },
        { ...alignedSegment, overlapDistanceMeters: 60 }
      ]);
      assert(projects.length === 1, "Duplicate project was not combined.");
      assert(
        projects[0].overlapDistanceMeters === 160,
        "Project overlap distances were not combined."
      );
    });

    test("scores both project count and exposure distance", () => {
      const exposure = calculateTrafficCalmingExposure([
        { overlapDistanceMeters: 100 },
        { overlapDistanceMeters: 400 }
      ]);
      assert(exposure.matchedDistanceMeters === 500, "Distance total is wrong.");
      assert(
        Math.abs(exposure.totalPenaltyMinutes - 1.75) < 0.0001,
        "Exposure penalty is wrong."
      );
    });

    test("recalculates existing scores when avoidance changes", () => {
      const analyzedRoutes = [{
        durationMinutes: 10,
        baseExposurePenaltyMinutes: 1.75,
        exposurePenaltyMinutes: 1.75,
        score: 11.75
      }];
      const recalculated = recalculateAnalyzedRouteScores(
        analyzedRoutes,
        2
      );
      assert(
        recalculated[0].exposurePenaltyMinutes === 3.5,
        "Penalty was not multiplied."
      );
      assert(recalculated[0].score === 13.5, "Adjusted score is wrong.");
      assert(
        analyzedRoutes[0].score === 11.75,
        "Scoring mutated the original route data."
      );
    });

    test("starts with 1.75x traffic-calming avoidance", () => {
      const routeState = createRouteAppState();
      assert(
        routeState.trafficCalmingPenaltyMultiplier === 1.75,
        "Default avoidance multiplier is wrong."
      );
    });

    test("normalizes browser routes for scoring and map rendering", () => {
      const normalized = normalizeBrowserRoute({
        description: "Test route",
        distanceMeters: 1609.344,
        durationMillis: 600000,
        path: [
          { lat: 36.1, lng: -86.8 },
          { lat: () => 36.2, lng: () => -86.7 }
        ]
      });
      const waypoint = createRouteWaypoint({
        latitude: 36.1,
        longitude: -86.8
      });

      assert(normalized.duration === "600s", "Duration was not normalized.");
      assert(
        normalized.polyline.geoJsonLinestring.coordinates[1][0] === -86.7 &&
          normalized.polyline.geoJsonLinestring.coordinates[1][1] === 36.2,
        "Route path was not converted to GeoJSON coordinate order."
      );
      assert(
        waypoint.lat === 36.1 && waypoint.lng === -86.8,
        "Route waypoint was not converted to a browser LatLng literal."
      );
    });

    test("swaps selected locations and clears the old route", () => {
      const routeState = createRouteAppState();
      routeState.startPlace = { formattedAddress: "Start address" };
      routeState.endPlace = { formattedAddress: "End address" };
      routeState.analyzedRoutes = [{ index: 0 }];

      const swapped = swapRouteState(routeState);

      assert(swapped, "Swap was rejected.");
      assert(
        routeState.startPlace.formattedAddress === "End address",
        "Start was not swapped."
      );
      assert(
        routeState.endPlace.formattedAddress === "Start address",
        "Destination was not swapped."
      );
      assert(routeState.analyzedRoutes.length === 0, "Old route was not cleared.");
    });

    test("clear resets locations and analyzed routes", () => {
      const routeState = createRouteAppState();
      routeState.startPlace = { formattedAddress: "Start address" };
      routeState.endPlace = { formattedAddress: "End address" };
      routeState.analyzedRoutes = [{ index: 0 }];
      routeState.currentRouteIndex = 2;

      clearRouteState(routeState);

      assert(
        routeState.startPlace === null && routeState.endPlace === null,
        "Locations were not cleared."
      );
      assert(routeState.analyzedRoutes.length === 0, "Routes were not cleared.");
      assert(routeState.currentRouteIndex === 0, "Selected route was not reset.");
    });

    await asyncTest(
      "loads only essential place fields and preserves the suggestion label",
      async () => {
        let requestedFields = [];
        const place = {
          async fetchFields({ fields }) {
            requestedFields = fields;
          }
        };
        const prediction = {
          text: { toString: () => "Fallback place name" },
          toPlace: () => place
        };

        const resolvedPlace = await resolvePlacePrediction(prediction);

        assert(resolvedPlace === place, "Resolved place object changed.");
        assert(
          requestedFields.join(",") === "formattedAddress,location",
          `Unexpected fields requested: ${requestedFields.join(",")}`
        );
        assert(
          getPlaceLabel(place) === "Fallback place name",
          "Autocomplete text was not retained as the fallback label."
        );
      }
    );

    const failedTests = testResults.filter((result) => !result.passed);
    document.body.dataset.testStatus =
      failedTests.length === 0 ? "passed" : "failed";
    document.getElementById("results").textContent = testResults
      .map((result) =>
        `${result.passed ? "PASS" : "FAIL"}: ${result.name}` +
        (result.message ? ` — ${result.message}` : "")
      )
      .join("\n");
  </script>
</body>
</html>
